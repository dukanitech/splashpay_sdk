name: splashpay_sdk
description: >-
  A standalone Flutter/Dart SDK for integrating the SplashPay Tanzania REST API.
  Supports Mobile Money payments, status checks, cancellations, and webhook helpers.
version: 1.0.0

homepage: https://docs.splashpay.co.tz
repository: https://github.com/dukanitech/splashpay_sdk
issue_tracker: https://github.com/dukanitech/splashpay_sdk/issues
documentation: https://github.com/dukanitech/splashpay_sdk#readme

topics:
  - payment
  - splashpay
  - mobile-money
  - tanzania
  - sdk

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  crypto: ^3.0.6
  dio: ^5.7.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  http_mock_adapter: ^0.6.1

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
